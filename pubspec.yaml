name: add_to_gallery
description: Saves a copy of images and videos to the Android Gallery and iOS Photos
version: 1.0.0
homepage: https://github.com/flowmobile/add_to_gallery
repository: https://github.com/flowmobile/add_to_gallery

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        package: flowmobile.add_to_gallery
        pluginClass: AddToGalleryPlugin
      ios:
        pluginClass: AddToGalleryPlugin
